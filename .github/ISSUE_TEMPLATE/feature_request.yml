name: Feature Request
description: Suggest a new feature or improvement for PolyAI
labels: ["enhancement", "needs-triage"]

body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - New provider
        - Existing provider — new capability
        - Client / async
        - Streaming
        - Types / API surface
        - Retry / reliability
        - CI/CD
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: What problem does this solve? What is the use case?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should it work? Include a code sketch if possible.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
