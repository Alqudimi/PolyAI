name: Bug Report
description: Something isn't working correctly in PolyAI
labels: ["bug", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill in as much detail as possible.

  - type: input
    id: version
    attributes:
      label: PolyAI Version
      placeholder: "e.g. 1.0.0"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python Version
      placeholder: "e.g. 3.11.4"
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: Affected Provider
      options:
        - ovhcloud
        - pollinations
        - mlvoca
        - devtoolbox
        - all / not provider-specific
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of what happened vs what you expected.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Reproduction
      description: Smallest code snippet that reproduces the bug. Remove any API keys.
      render: python
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: Error / Traceback
      render: text

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues
          required: true
        - label: I am using the latest version of PolyAI
          required: true
        - label: I removed all API keys from the reproduction snippet
          required: true
