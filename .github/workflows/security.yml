name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run every day at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # for SARIF upload
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # JOB 1 — Dependency vulnerability audit
  # ─────────────────────────────────────────────
  dependency-audit:
    name: Dependency Audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit production dependencies
        run: |
          pip install -e .
          pip-audit \
            --desc \
            --format markdown \
            --output pip-audit-report.md \
            || (cat pip-audit-report.md && exit 1)

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-report
          path: pip-audit-report.md
          retention-days: 30

  # ─────────────────────────────────────────────
  # JOB 2 — SAST with Bandit
  # ─────────────────────────────────────────────
  sast-bandit:
    name: SAST — Bandit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install "bandit[toml, sarif]"

      - name: Run Bandit (SARIF)
        run: |
          bandit -r polyai \
            -f sarif \
            -o bandit-results.sarif \
            --severity-level medium \
            --confidence-level medium \
            --exclude polyai/__pycache__ \
            || true

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: bandit-results.sarif
          category: bandit

      - name: Run Bandit (human-readable, fail on high)
        run: |
          bandit -r polyai \
            --severity-level high \
            --confidence-level high \
            --exclude polyai/__pycache__

  # ─────────────────────────────────────────────
  # JOB 3 — Secret scanning with TruffleHog
  # ─────────────────────────────────────────────
  secret-scan:
    name: Secret Scan — TruffleHog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  # ─────────────────────────────────────────────
  # JOB 4 — CodeQL analysis
  # ─────────────────────────────────────────────
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: codeql-python

  # ─────────────────────────────────────────────
  # JOB 5 — Validate no hardcoded credentials
  # ─────────────────────────────────────────────
  credential-check:
    name: Hardcoded Credential Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Scan for hardcoded patterns
        run: |
          python3 - <<'EOF'
          import re, sys
          from pathlib import Path

          # Patterns that should NEVER appear in source
          BAD_PATTERNS = [
              (r'sk-[A-Za-z0-9]{20,}',            'OpenAI-style key'),
              (r'OVHCLOUD_API_KEY\s*=\s*"[^"]{8,}"', 'Hardcoded OVHcloud key'),
              (r'dtb_[A-Za-z0-9]{10,}',            'DevToolbox key'),
              (r'(?i)password\s*=\s*"[^"]{4,}"',  'Hardcoded password'),
              (r'(?i)secret\s*=\s*"[^"]{4,}"',    'Hardcoded secret'),
          ]

          issues = []
          for path in Path('polyai').rglob('*.py'):
              text = path.read_text()
              for pattern, label in BAD_PATTERNS:
                  for m in re.finditer(pattern, text):
                      issues.append(f'{path}:{label}: {m.group()[:40]}')

          if issues:
              print('::error::Potential hardcoded credentials found:')
              for i in issues:
                  print(f'  {i}')
              sys.exit(1)
          print('No hardcoded credentials found.')
          EOF
